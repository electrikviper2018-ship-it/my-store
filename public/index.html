<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f3f5f9;--card:#fff;--accent:#ff5a1f;--line:#d5dae5;--muted:#5b6478}
@media (prefers-color-scheme:dark){:root{--ink:#eef1f8;--paper:#0f1626;--card:#18223a;--line:#2a3654;--muted:#9aa5bf}}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,4vw,3rem);border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:#fff;border:0;padding:.65rem 1.1rem;font-weight:600;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--ink);font-weight:600;padding:.5rem}
.hero{padding:clamp(2rem,8vw,6rem) clamp(1rem,4vw,3rem) 2rem;max-width:60rem}
.hero h2{font-size:clamp(2.4rem,9vw,6rem);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0 0 1rem}
.hero p{color:var(--muted);max-width:40ch;margin:0}
#banner{background:var(--accent);color:#fff;padding:.7rem clamp(1rem,4vw,3rem);font-weight:600}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem;padding:1rem clamp(1rem,4vw,3rem) 4rem}
.item{display:flex;flex-direction:column;gap:.6rem}
.item img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--card);border:1px solid var(--line);border-radius:4px}
.item h3{margin:0;font-size:1.05rem}
.row{display:flex;gap:.5rem}
select{flex:1;font:inherit;padding:.55rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.price{font-weight:800}
aside{position:fixed;top:0;right:0;height:100%;width:min(24rem,100%);background:var(--card);border-left:2px solid var(--ink);padding:1.25rem;display:flex;flex-direction:column;gap:1rem;transform:translateX(100%);transition:transform .2s}
aside.open{transform:none}
aside h2{margin:0}
#lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.line{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
.line small{color:var(--muted);display:block}
#msg{color:var(--accent);min-height:1.2em;margin:0}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Print Shop</h1>
  <button class="link" id="open-cart">Cart (<span id="count">0</span>)</button>
</header>
<div id="banner" hidden>Thanks for your order. A confirmation email is on its way.</div>
<section class="hero">
  <h2>Made when you order it.</h2>
  <p>Every item is printed on demand and shipped straight to your door.</p>
</section>
<main id="grid" aria-live="polite"><p>Loading products…</p></main>

<aside id="cart" aria-label="Shopping cart">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h2>Your cart</h2><button class="link" id="close-cart">Close</button>
  </div>
  <div id="lines"></div>
  <p class="price">Subtotal: <span id="total">$0.00</span></p>
  <p style="margin:0;color:var(--muted);font-size:.9rem">Shipping is calculated at checkout.</p>
  <p id="msg" role="alert"></p>
  <button class="btn" id="checkout" disabled>Check out</button>
</aside>

<script>
const $ = (id) => document.getElementById(id);
const money = (c) => `$${(c / 100).toFixed(2)}`;
let products = [];
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

if (new URLSearchParams(location.search).get('order') === 'success') {
  $('banner').hidden = false;
  cart = [];
  history.replaceState({}, '', '/');
}

const save = () => localStorage.setItem('cart', JSON.stringify(cart));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderProducts() {
  $('grid').innerHTML = products.length ? '' : '<p>No products yet. Publish a product in Printify and refresh.</p>';
  products.forEach((p) => {
    const el = document.createElement('article');
    el.className = 'item';
    el.innerHTML = `
      <img src="${esc(p.image || '')}" alt="${esc(p.title)}" loading="lazy">
      <h3>${esc(p.title)}</h3>
      <div class="row">
        <select aria-label="Options for ${esc(p.title)}">
          ${p.variants.map((v) => `<option value="${v.id}">${esc(v.title)} · ${money(v.price)}</option>`).join('')}
        </select>
        <button class="btn">Add to cart</button>
      </div>`;
    el.querySelector('button').onclick = () => add(p.id, Number(el.querySelector('select').value));
    $('grid').append(el);
  });
}

function add(productId, variantId) {
  const found = cart.find((i) => i.productId === productId && i.variantId === variantId);
  found ? found.quantity++ : cart.push({ productId, variantId, quantity: 1 });
  renderCart();
  $('cart').classList.add('open');
}

function lookup(i) {
  const p = products.find((x) => x.id === i.productId);
  const v = p?.variants.find((x) => x.id === i.variantId);
  return p && v ? { p, v } : null;
}

function renderCart() {
  cart = cart.filter((i) => lookup(i) && i.quantity > 0);
  save();
  $('count').textContent = cart.reduce((n, i) => n + i.quantity, 0);
  $('checkout').disabled = !cart.length;
  $('lines').innerHTML = cart.length ? '' : '<p>Your cart is empty. Add an item to get started.</p>';
  let total = 0;
  cart.forEach((i) => {
    const { p, v } = lookup(i);
    total += v.price * i.quantity;
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML = `<div>${esc(p.title)}<small>${esc(v.title)} · ${money(v.price)}</small></div>
      <div class="row"><button class="link" aria-label="Remove one">−</button>${i.quantity}<button class="link" aria-label="Add one">+</button></div>`;
    const [minus, plus] = el.querySelectorAll('button');
    minus.onclick = () => { i.quantity--; renderCart(); };
    plus.onclick = () => { i.quantity++; renderCart(); };
    $('lines').append(el);
  });
  $('total').textContent = money(total);
}

$('open-cart').onclick = () => $('cart').classList.add('open');
$('close-cart').onclick = () => $('cart').classList.remove('open');

$('checkout').onclick = async () => {
  $('msg').textContent = '';
  $('checkout').disabled = true;
  try {
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cart }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    location.href = data.url;
  } catch (err) {
    $('msg').textContent = err.message || 'Checkout failed. Try again.';
    $('checkout').disabled = false;
  }
};

fetch('/api/products')
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((data) => { products = data; renderProducts(); renderCart(); })
  .catch(() => { $('grid').innerHTML = '<p>Products failed to load. Check your Printify token and shop ID, then refresh.</p>'; });
</script>
</body>
</html>
